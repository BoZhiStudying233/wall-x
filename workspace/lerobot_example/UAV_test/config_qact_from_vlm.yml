# Train from Qwen-2.5-VL

# Model and paths configuration
log_name: "robotic_training"
log_project: "vla_training"
model_type: qwen2_5
pretrained_wallx_path: "/inspire/hdd/global_user/konghanlin-253108540238/VLA_pt/Qwen2.5-VL-3B-Instruct"  # Must set
save_path: "/inspire/hdd/global_user/konghanlin-253108540238/wall-x-pt"                # Must set
use_fast_tokenizer: True                       # True: train FAST, False: train Flow
action_tokenizer_path: "/inspire/hdd/global_user/konghanlin-253108540238/fast_tokenizer"         # Must set if use_fast_tokenizer is true
qwen_vl_act_config_path: "/inspire/hdd/global_user/konghanlin-253108540238/new_wallx/workspace/lerobot_example/UAV_test/qwen25_config.json"


# Torch Profile
profile: False
profile_save_path: /path/to/profile/
profile_wait_iters: 10
profile_warmup_iters: 5
profile_active_iters: 2

# Training hyperparameters
num_warmup_steps: 100
num_training_steps: 64000000
learning_rate: 0.00009
min_lr: 0.00005
num_epoch: 100
gradient_accumulation_steps: 1
batch_size_per_gpu: 1
padding_side: left
epoch_save_interval: 10

# Training optimization settings
FSDP2: True
torch_compile: False

# # Checkpoint resuming configuration
# resume:
#   ckpt: "/path/to/resume_model/"
#   load_ckpt_only: true

norm_stats_path: "/inspire/hdd/global_user/konghanlin-253108540238/new_wallx/workspace/lerobot_example/UAV_test/norm_stats.json"

enable_customized_robot_config: true
customized_robot_config:
  name: "dzb/our_data_test"
  customized_dof_config:
    "next_position" : 3
    "next_quarternion"  : 4

  customized_agent_pos_config:
    "position" : 3
    "quarternion"  : 4

# Data configuration
data:
  use_lerobot: true

  # LeRobot dataset configuration
  lerobot_config:
    repo_id: "dzb/our_data_test"
    root: null
    episodes: null
    image_transforms: null
    delta_timestamps: null
    tolerance_s: 1e-4
    revision: null
    force_cache_sync: false
    download_videos: true
    video_backend: null

  action_horizon: 32
  train_test_split: 0.95

  # Action keys for observation and prediction
  obs_action_keys:
    - position
    - quarternion


  predict_action_keys:
    - position
    - quarternion


  # Image resolution configuration for different camera views
  resolution:
    face_view: 480
