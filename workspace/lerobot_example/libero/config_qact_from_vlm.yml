# Training Configuration for Wall-X Robotic Multi-Modal Learning
# This configuration supports multi-modal learning with vision, language, and action data

# Model and paths configuration
log_name: "opensource_training"
log_project: "libero"
model_type: qwen2_5
use_fast_tokenizer: true
pretrained_wallx_path: "/inspire/hdd/global_user/konghanlin-253108540238/VLA_pt/Qwen2.5-VL-3B-Instruct"
action_tokenizer_path: "/inspire/hdd/global_user/konghanlin-253108540238/fast_tokenizer"
qwen_vl_act_config_path: "/inspire/hdd/global_user/konghanlin-253108540238/new_wallx/workspace/lerobot_example/qwen25_config.json"

save_path: "/inspire/hdd/global_user/konghanlin-253108540238/wall-x-pt"
# Torch Profile
profile: False
profile_save_path: /path/to/profile/
profile_wait_iters: 10
profile_warmup_iters: 5
profile_active_iters: 2

# Training hyperparameters
num_warmup_steps: 100
num_training_steps: 64000000
learning_rate: 0.00005
min_lr: 0.00005
num_epoch: 100
gradient_accumulation_steps: 1
batch_size_per_gpu: 1
padding_side: left
epoch_save_interval: 1

norm_stats_path: "/inspire/hdd/global_user/konghanlin-253108540238/new_wallx/workspace/lerobot_example/libero/libero_norm_stats.json"

enable_customized_robot_config: true
customized_robot_config:
  name: "physical-intelligence/libero"
  customized_dof_config:
    "panda_action_eef_with_gripper": 7

  customized_agent_pos_config:
    "panda_state_eef_with_gripper": 8

# Checkpoint resuming configuration
# resume:
#   ckpt: "/path/to/ckpt"
#   load_ckpt_only: false

# Data configuration
data:
  use_lerobot: true

  # LeRobot dataset configuration
  lerobot_config:
    repo_id: "physical-intelligence/libero"
    root: null
    episodes: null
    image_transforms: null
    delta_timestamps: null
    tolerance_s: 1e-4
    revision: null
    force_cache_sync: false
    download_videos: true
    video_backend: null

  action_horizon: 32
  train_test_split: 0.95

  # Action keys for observation and prediction
  obs_action_keys:
    - follow_left_ee_cartesian_pos
    - follow_left_ee_rotation
    - follow_left_gripper
    - follow_right_ee_cartesian_pos
    - follow_right_ee_rotation
    - follow_right_gripper
    - head_actions
    - height
    - car_pose

  predict_action_keys:
    - follow_left_ee_cartesian_pos
    - follow_left_ee_rotation
    - follow_left_gripper
    - follow_right_ee_cartesian_pos
    - follow_right_ee_rotation
    - follow_right_gripper
    - head_actions
    - height
    - car_pose

  # Image resolution configuration for different camera views
  resolution:
    face_view: 256
    left_wrist_view: 256
    right_wrist_view: 256
    move1_view: 256
    move2_view: 256
    top_view: 256
    wall_view: 256
    multi_modal: 256
