# Training Configuration for Wall-X Robotic Multi-Modal Learning
# This configuration supports multi-modal learning with vision, language, and action data

# Model and paths configuration
log_name: "robotic_training"
log_project: "vla_training"
model_type: wall-oss
pretrained_wallx_path: "/inspire/hdd/global_user/konghanlin-253108540238/VLA_pt/wall-oss-fast"  # Must set
save_path: "/inspire/hdd/global_user/konghanlin-253108540238/wall-x-pt_walloss_fast_tinydata"                # Must set
use_fast_tokenizer: True                       # True: train FAST, False: train Flow
action_tokenizer_path: "/inspire/hdd/global_user/konghanlin-253108540238/fast_tokenizer"         # Must set if use_fast_tokenizer is true

# Torch Profile
profile: False
profile_save_path: /path/to/profile/
profile_wait_iters: 10
profile_warmup_iters: 5
profile_active_iters: 2

# Training hyperparameters
num_warmup_steps: 100
num_training_steps: 64000000
learning_rate: 0.00005
min_lr: 0.00005
num_epoch: 100
gradient_accumulation_steps: 1
batch_size_per_gpu: 8
padding_side: left
epoch_save_interval: 99

# Training optimization settings
FSDP2: True
torch_compile: False

# # Checkpoint resuming configuration
# resume:
#   ckpt: "/path/to/resume_model/"
#   load_ckpt_only: true

norm_stats_path: "/inspire/hdd/global_user/konghanlin-253108540238/user_cache/lerobot/dzb/our_data_tiny/norm_stats.json"

enable_customized_robot_config: true
customized_robot_config:
  name: "dzb/our_data_tiny"
  customized_dof_config:
    "position" : 3
    "rotation" : 3

  customized_agent_pos_config:
    "position" : 3
    "rotation" : 3

# Data configuration
data:
  use_lerobot: true

  # LeRobot dataset configuration
  lerobot_config:
    repo_id: "dzb/our_data_tiny"
    root: null
    episodes: null
    image_transforms: null
    delta_timestamps: null
    tolerance_s: 1e-4
    revision: null
    force_cache_sync: false
    download_videos: true
    video_backend: null

  action_horizon: 5
  train_test_split: 0.95

  # Action keys for observation and prediction
  obs_action_keys:
    - position
    - rotation


  predict_action_keys:
    - position
    - rotation


  # Image resolution configuration for different camera views
  resolution:
    face_view: 480
